name: Release

# Triggered by pushing a tag like v0.1.0. Builds the extension on a clean
# Ubuntu runner, packages it as a .vsix, creates a GitHub Release, and
# attaches the .vsix as a download.
#
# Just push a tag: `git tag v0.1.0 && git push --tags`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required for creating the release + uploading assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hmm-code-vscode
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clone hmm-code-pi (sibling — build requires it)
        run: git clone --depth 1 https://github.com/lbm1202/hmm-code-pi.git ../hmm-code-pi

      - name: Install npm dependencies
        run: npm ci

      - name: Build (bundles Pi + hmm-code-pi into out/vendor)
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) does not match tag ($TAG_VER). Bump package.json before tagging."
            exit 1
          fi

      - name: Package .vsix
        run: npx --yes @vscode/vsce package

      - name: Upload .vsix as workflow artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: hmm-code-${{ steps.version.outputs.version }}.vsix
          path: hmm-code-${{ steps.version.outputs.version }}.vsix
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hmm-code-${{ steps.version.outputs.version }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            Download `hmm-code-${{ steps.version.outputs.version }}.vsix` below, then in VS Code:

            ```bash
            code --install-extension hmm-code-${{ steps.version.outputs.version }}.vsix
            ```

            The .vsix bundles Pi runtime + hmm-code-pi extension — no separate Pi install required. Reload VS Code window after installing.
