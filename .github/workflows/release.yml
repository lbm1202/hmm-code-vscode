name: Release

# Triggered by pushing a tag like v0.1.0. Builds the extension on a clean
# Ubuntu runner, packages it as a .vsix, creates a GitHub Release, and
# attaches the .vsix as a download.
#
# Just push a tag: `git tag v0.1.0 && git push --tags`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required for creating the release + uploading assets

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level so the marketplace publish steps can gate on `env.*_PAT != ''`
    # (secrets can't be referenced directly in a step `if:`). Unset secret →
    # empty string → that publish is skipped, and the GitHub Release still ships.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout hmm-code-vscode
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clone hmm-code-pi (sibling — build requires it)
        run: git clone --depth 1 https://github.com/lbm1202/hmm-code-pi.git ../hmm-code-pi

      - name: Install npm dependencies
        run: npm ci

      - name: Build (bundles Pi + hmm-code-pi into out/vendor)
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) does not match tag ($TAG_VER). Bump package.json before tagging."
            exit 1
          fi

      - name: Package .vsix
        run: npx --yes @vscode/vsce package

      - name: Upload .vsix as workflow artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: hmm-code-${{ steps.version.outputs.version }}.vsix
          path: hmm-code-${{ steps.version.outputs.version }}.vsix
          retention-days: 14

      # Compose the release body from CHANGELOG.md: the section for this tag's
      # version (everything between "## [X.Y.Z]" and the next "## [" heading) +
      # the Install boilerplate. softprops then appends the auto-generated commit
      # list below. CHANGELOG.md is the single source of truth — write the rich
      # notes (incl. an optional "### ✨ Highlights") there, not on the Release page.
      - name: Compose release notes from CHANGELOG
        id: notes
        run: |
          VER="${{ steps.version.outputs.version }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          # \] anchors the version so ver=0.1.1 doesn't match "## [0.1.1-rc2]".
          SECTION=$(awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "::warning::No CHANGELOG.md section found for $VER — release body falls back to Install boilerplate only."
          fi
          {
            if [ -n "$SECTION" ]; then
              printf '## hmm-code %s\n' "$VER"
              printf '%s\n' "$SECTION"
              printf '\n---\n\n'
            fi
            printf '## Install\n\n'
            printf 'Download `hmm-code-%s.vsix` below, then in VS Code:\n\n' "$VER"
            printf '```bash\ncode --install-extension hmm-code-%s.vsix\n```\n\n' "$VER"
            printf 'The .vsix bundles Pi runtime + hmm-code-pi extension — no separate Pi install required. Reload VS Code window after installing.\n'
          } > "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hmm-code-${{ steps.version.outputs.version }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags with a pre-release identifier (v0.1.1-rc1, v0.2.0-beta…) are
          # published as GitHub pre-releases; clean vX.Y.Z tags are full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.path }}

      # Marketplace publishing — uploads the SAME .vsix built above (no rebuild).
      # Both steps are opt-in: they only run for a clean (non-pre-release) tag AND
      # when the corresponding token secret is configured, so the release keeps
      # working before the secrets exist. vsce/ovsx read the PAT from the env.
      # One-time setup: see RELEASING.md (publisher + Azure DevOps PAT → VSCE_PAT;
      # Open VSX token → OVSX_PAT; `ovsx create-namespace lbm1202` once).
      - name: Publish to VS Code Marketplace
        if: ${{ !contains(github.ref_name, '-') && env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --packagePath "hmm-code-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to Open VSX
        if: ${{ !contains(github.ref_name, '-') && env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish "hmm-code-${{ steps.version.outputs.version }}.vsix"
